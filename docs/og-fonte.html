<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Fonte da imagem de prévia (og.png)</title>
<style>
/* Esta página só serve para gerar assets/og.png (1200 x 630), a imagem que aparece quando o link é compartilhado.
   Para refazer a imagem: abrir no Chrome em modo sem janela, com --window-size=1200,630 (ver docs/PASSAGEM.md). */
@font-face{font-family:"Big Shoulders Display";font-weight:100 900;src:url(../assets/fonts/big-shoulders-display-latin-wght-normal.woff2) format("woff2")}
@font-face{font-family:"Red Hat Text";font-weight:300 700;src:url(../assets/fonts/red-hat-text-latin-wght-normal.woff2) format("woff2")}
@font-face{font-family:"Red Hat Display";font-weight:300 900;src:url(../assets/fonts/red-hat-display-latin-wght-normal.woff2) format("woff2")}
@font-face{font-family:"Red Hat Mono";font-weight:300 700;src:url(../assets/fonts/red-hat-mono-latin-wght-normal.woff2) format("woff2")}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden;background:#fff;color:#16161A;font-family:"Red Hat Text",sans-serif}
.regua{position:absolute;left:64px;right:64px;top:0;height:12px;background:linear-gradient(#16161A,#16161A) 0 0/100% 4px no-repeat,repeating-linear-gradient(90deg,rgba(22,22,26,.16) 0 1px,transparent 1px 14px) 0 7px/100% 5px no-repeat}
.regua::after{content:"";position:absolute;left:0;top:0;width:96px;height:12px;background:#F26A0F;border-radius:0 0 4px 4px}
.marca{position:absolute;left:64px;top:52px;display:flex;align-items:center;gap:14px;font:700 28px/1 "Red Hat Display",sans-serif;letter-spacing:-.01em}
.marca i{width:26px;height:31px;background:radial-gradient(circle at 70% 27%,#fff 0 3.4px,transparent 4px),#F26A0F;clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%);transform:rotate(-8deg)}
h1{position:absolute;left:64px;top:128px;width:700px;font:800 88px/.98 "Big Shoulders Display",sans-serif;letter-spacing:0}
h1 em{font-style:normal;color:#F26A0F}
.sub{position:absolute;left:64px;bottom:64px;font:400 26px/1.4 "Red Hat Text",sans-serif;color:#5C5C64;width:660px}
.url{position:absolute;right:64px;bottom:36px;font:500 20px/1 "Red Hat Mono",monospace;color:#8A8A92}
.tag{position:absolute;right:64px;top:118px;width:372px;border:5px solid #16161A;border-radius:18px;padding:34px 36px 30px;background:#fff}
.tag::before{content:"";position:absolute;right:22px;top:22px;width:22px;height:22px;border:5px solid #16161A;border-radius:50%}
.tag small{display:block;font:500 21px/1.2 "Red Hat Mono",monospace;color:#5C5C64;padding-right:44px}
.tag b{display:block;margin-top:16px;font:800 122px/.84 "Big Shoulders Display",sans-serif;white-space:nowrap}
.tag b span{font-size:52px;color:#5C5C64;margin-right:8px}
.laranja{position:absolute;right:64px;top:388px;width:372px;background:#F26A0F;border-radius:18px;padding:24px 36px;color:#fff;display:flex;align-items:baseline;gap:20px}
.laranja b{font:800 84px/.9 "Big Shoulders Display",sans-serif}
.laranja span{font:500 23px/1.3 "Red Hat Text",sans-serif}
</style></head>
<body>
<div class="regua"></div>
<div class="marca"><i></i>Preço Aberto</div>
<h1>Quanto custa a mesma compra em cada <em>bairro</em>?</h1>
<p class="sub">100 produtos, 10 supermercados e 25 bairros de São Paulo, lidos todo dia.</p>
<div class="tag"><small>Cesta de 78 itens, média da cidade</small><b><span>R$</span>1.099</b></div>
<div class="laranja"><b>10</b><span>supermercados comparados<br>em cada bairro</span></div>
<p class="url">theoscala45.github.io/preco-do-dia-a-dia</p>
</body></html>
