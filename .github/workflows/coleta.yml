name: Coleta noturna de preços

# Cada zona da cidade (5 CEPs) é uma parte separada, e as redes de preço único (um preço só para a
# cidade) têm uma parte própria, "Unico". No máximo 2 partes rodam ao mesmo tempo,
# para o site da rede receber poucas visitas por vez. No fim, uma última parte junta tudo,
# grava no repositório e abre a issue "Falha na coleta" se algo deu errado.

on:
  schedule:
    - cron: "17 5 * * *"   # 02h17 em São Paulo
  workflow_dispatch:
    inputs:
      zonas:
        description: "Zonas, separadas por vírgula (Unico,Centro,Oeste,Sul,Leste,Norte). Vazio = todas"
        default: ""
      limite:
        description: "Ler só os N primeiros produtos (0 = todos)"
        default: "0"

permissions:
  contents: write
  issues: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        zona: [Unico, Centro, Oeste, Sul, Leste, Norte]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar o navegador automático
        if: ${{ !inputs.zonas || contains(inputs.zonas, matrix.zona) }}
        run: |
          pip install playwright==1.49.1
          python -m playwright install --with-deps chromium
      - name: Coletar a zona ${{ matrix.zona }}
        if: ${{ !inputs.zonas || contains(inputs.zonas, matrix.zona) }}
        run: python coletor/coletar.py --zona "${{ matrix.zona }}" --limite "${{ inputs.limite || '0' }}" --saida "saida/${{ matrix.zona }}" --diagnostico "saida/${{ matrix.zona }}/diagnostico"
      - name: Entregar o resultado da zona
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zona-${{ matrix.zona }}
          path: saida/${{ matrix.zona }}
          if-no-files-found: ignore
          retention-days: 7

  juntar:
    needs: coletar
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Receber o resultado das zonas
        uses: actions/download-artifact@v4
        with:
          pattern: zona-*
          path: zonas
      - name: Guardar as tabelas no repositório
        run: |
          mkdir -p zonas
          python coletor/juntar.py zonas/*/
          git config user.name "coletor"
          git config user.email "coletor@users.noreply.github.com"
          git add data/precos data/execucoes.csv
          if git diff --cached --quiet; then echo "nada novo"; exit 0; fi
          git commit -m "Coleta de $(TZ=America/Sao_Paulo date +%F)"
          for i in 1 2 3; do git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && break || sleep 15; done
      - name: Avisar se algo falhou
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python coletor/alerta.py; falhou=$?
          cat coletor/resumo.md >> "$GITHUB_STEP_SUMMARY"
          aberta=$(gh issue list --state open --search "Falha na coleta in:title" --json number --jq '.[0].number')
          if [ "$falhou" != "0" ]; then
            if [ -n "$aberta" ]; then gh issue comment "$aberta" --body-file coletor/resumo.md
            else gh issue create --title "Falha na coleta" --body-file coletor/resumo.md; fi
          elif [ -n "$aberta" ]; then
            gh issue comment "$aberta" --body-file coletor/resumo.md
            gh issue close "$aberta" --comment "A coleta de hoje deu certo. Fechando."
          fi
          exit 0
