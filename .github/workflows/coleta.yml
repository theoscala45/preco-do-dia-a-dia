name: Coleta noturna de preços

on:
  schedule:
    - cron: "17 5 * * *"   # 02h17 em São Paulo
  workflow_dispatch:
    inputs:
      ceps:
        description: "Pontos de coleta (ex.: C06,C18). Vazio = os 25"
        default: ""
      limite:
        description: "Ler só os N primeiros produtos (0 = todos)"
        default: "0"

permissions:
  contents: write
  issues: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar o navegador automático
        run: |
          pip install playwright==1.49.1
          python -m playwright install --with-deps chromium
      - name: Coletar
        run: python coletor/coletar.py --ceps "${{ inputs.ceps }}" --limite "${{ inputs.limite || '0' }}" --diagnostico diagnostico
      - name: Guardar as tabelas no repositório
        if: always()
        run: |
          git config user.name "coletor"
          git config user.email "coletor@users.noreply.github.com"
          git add data/precos data/execucoes.csv
          if git diff --cached --quiet; then echo "nada novo"; exit 0; fi
          git commit -m "Coleta de $(TZ=America/Sao_Paulo date +%F)"
          for i in 1 2 3; do git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && break || sleep 15; done
      - name: Guardar o diagnóstico das páginas que falharam
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico
          path: diagnostico
          if-no-files-found: ignore
          retention-days: 7
      - name: Avisar se algo falhou
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python coletor/alerta.py; falhou=$?
          cat coletor/resumo.md >> "$GITHUB_STEP_SUMMARY"
          aberta=$(gh issue list --state open --search "Falha na coleta in:title" --json number --jq '.[0].number')
          if [ "$falhou" != "0" ]; then
            if [ -n "$aberta" ]; then gh issue comment "$aberta" --body-file coletor/resumo.md
            else gh issue create --title "Falha na coleta" --body-file coletor/resumo.md; fi
          elif [ -n "$aberta" ]; then
            gh issue comment "$aberta" --body-file coletor/resumo.md
            gh issue close "$aberta" --comment "A coleta de hoje deu certo. Fechando."
          fi
          exit 0
